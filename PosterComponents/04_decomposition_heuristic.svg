<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Segoe UI, Arial, sans-serif">
  <!-- ============================================================
       COMPONENT 04 — DECOMPOSITION HEURISTIC (divide & conquer)
       One big problem -> windowed subproblems solved in sequence
       -> merged solution. Visualizes the scaling fix.
       ============================================================ -->
  <defs>
    <marker id="arr04" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6B85"/>
    </marker>
  </defs>

  <text x="30" y="40" fill="#14233F" font-size="26" font-weight="700">Decomposition Heuristic: Scaling the Solver</text>
  <rect x="30" y="52" width="120" height="5" rx="2" fill="#14B8A6"/>
  <text x="30" y="84" fill="#5A6B85" font-size="15">A matheuristic: split one intractable model into smaller exact sub-solves, then merge.</text>

  <!-- Problem: one large block (slow / out of memory) -->
  <text x="120" y="140" fill="#C2410C" font-size="16" font-weight="700" text-anchor="middle">Monolithic MILP</text>
  <rect x="40" y="160" width="160" height="300" rx="10" fill="#FDE7DE" stroke="#F0A98C"/>
  <g fill="#E1714B" opacity="0.55">
    <rect x="58"  y="180" width="124" height="20" rx="3"/>
    <rect x="58"  y="208" width="124" height="20" rx="3"/>
    <rect x="58"  y="236" width="124" height="20" rx="3"/>
    <rect x="58"  y="264" width="124" height="20" rx="3"/>
    <rect x="58"  y="292" width="124" height="20" rx="3"/>
    <rect x="58"  y="320" width="124" height="20" rx="3"/>
    <rect x="58"  y="348" width="124" height="20" rx="3"/>
    <rect x="58"  y="376" width="124" height="20" rx="3"/>
    <rect x="58"  y="404" width="124" height="20" rx="3"/>
    <rect x="58"  y="432" width="124" height="20" rx="3"/>
  </g>
  <text x="120" y="492" fill="#C2410C" font-size="13" text-anchor="middle">slow • runs out of memory</text>
  <text x="120" y="510" fill="#C2410C" font-size="13" text-anchor="middle">at large scale</text>

  <!-- split arrow -->
  <line x1="210" y1="310" x2="280" y2="310" stroke="#5A6B85" stroke-width="3" marker-end="url(#arr04)"/>
  <text x="245" y="298" fill="#5A6B85" font-size="13" text-anchor="middle">split</text>

  <!-- Windowed subproblems solved in sequence -->
  <text x="540" y="140" fill="#2C6EBD" font-size="16" font-weight="700" text-anchor="middle">Windowed sub-solves (in sequence)</text>
  <g font-size="13" fill="#1B2A4A">
    <!-- window 1 -->
    <rect x="300" y="170" width="180" height="80" rx="8" fill="#EAF1FB" stroke="#A9C6EE"/>
    <text x="390" y="198" text-anchor="middle" font-weight="600">Window 1</text>
    <text x="390" y="220" text-anchor="middle" fill="#5A6B85">exact MILP / MISOCP</text>
    <text x="390" y="238" text-anchor="middle" fill="#5A6B85" font-size="11">small, fast</text>
    <!-- window 2 -->
    <rect x="300" y="270" width="180" height="80" rx="8" fill="#EAF1FB" stroke="#A9C6EE"/>
    <text x="390" y="298" text-anchor="middle" font-weight="600">Window 2</text>
    <text x="390" y="320" text-anchor="middle" fill="#5A6B85">fixes prior placements</text>
    <text x="390" y="338" text-anchor="middle" fill="#5A6B85" font-size="11">carries state forward</text>
    <!-- window 3 -->
    <rect x="300" y="370" width="180" height="80" rx="8" fill="#EAF1FB" stroke="#A9C6EE"/>
    <text x="390" y="398" text-anchor="middle" font-weight="600">Window 3 … N</text>
    <text x="390" y="420" text-anchor="middle" fill="#5A6B85">repeat to completion</text>
  </g>
  <!-- sequence arrows -->
  <g stroke="#2C6EBD" stroke-width="2.5" fill="none">
    <line x1="390" y1="250" x2="390" y2="266" marker-end="url(#arr04)"/>
    <line x1="390" y1="350" x2="390" y2="366" marker-end="url(#arr04)"/>
  </g>

  <!-- merge arrow -->
  <line x1="490" y1="310" x2="560" y2="310" stroke="#5A6B85" stroke-width="3" marker-end="url(#arr04)"/>
  <text x="525" y="298" fill="#5A6B85" font-size="13" text-anchor="middle">merge</text>

  <!-- Merged solution -->
  <text x="700" y="140" fill="#0E9384" font-size="16" font-weight="700" text-anchor="middle">Merged solution</text>
  <rect x="600" y="200" width="200" height="220" rx="10" fill="#EAF6F4" stroke="#A7E0D6"/>
  <g fill="#14B8A6" opacity="0.6">
    <rect x="620" y="220" width="160" height="22" rx="3"/>
    <rect x="620" y="250" width="160" height="22" rx="3"/>
    <rect x="620" y="280" width="160" height="22" rx="3"/>
    <rect x="620" y="310" width="160" height="22" rx="3"/>
    <rect x="620" y="340" width="160" height="22" rx="3"/>
    <rect x="620" y="370" width="160" height="22" rx="3"/>
  </g>
  <text x="700" y="450" fill="#0E9384" font-size="13" text-anchor="middle">near-optimal • practical run time</text>

  <!-- Outcome callouts -->
  <g font-size="14">
    <rect x="850" y="210" width="220" height="90" rx="10" fill="#FFFFFF" stroke="#D6E0EE"/>
    <text x="870" y="240" fill="#14233F" font-weight="700">Result</text>
    <text x="870" y="266" fill="#1B2A4A">Runs at large scale</text>
    <text x="870" y="288" fill="#1B2A4A">within time + memory</text>

    <rect x="850" y="320" width="220" height="90" rx="10" fill="#FFFFFF" stroke="#D6E0EE"/>
    <text x="870" y="350" fill="#14233F" font-weight="700">Trade-off</text>
    <text x="870" y="376" fill="#1B2A4A">Solution quality kept</text>
    <text x="870" y="398" fill="#1B2A4A">trustworthy vs. exact</text>
  </g>
</svg>
