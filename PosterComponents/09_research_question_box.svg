<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="Segoe UI, Arial, sans-serif">
  <!-- ============================================================
       COMPONENT 09 — RESEARCH QUESTION + HYPOTHESIS BOX
       Mirrors the "Research Question / Hypothesis" panels in samples.
       ============================================================ -->
  <defs>
    <filter id="sh09" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#14233F" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#sh09)">
    <rect x="10" y="10" width="540" height="420" rx="14" fill="#FFFFFF" stroke="#D6E0EE"/>
  </g>
  <path d="M10 24 a14 14 0 0 1 14 -14 h512 a14 14 0 0 1 14 14 v40 h-540 z" fill="#14233F"/>
  <text x="30" y="50" fill="#FFFFFF" font-size="20" font-weight="700">Research Question &amp; Hypotheses</text>

  <!-- RQ -->
  <text x="30" y="100" fill="#2C6EBD" font-size="16" font-weight="700">Research Question</text>
  <foreignObject x="30" y="112" width="500" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI,Arial,sans-serif;font-size:15px;color:#1B2A4A;line-height:1.35;">
      Can a unified optimization layer pack many tenants onto a shared cluster with overcommit while still guaranteeing service level agreements at scale?
    </div>
  </foreignObject>

  <line x1="30" y1="200" x2="530" y2="200" stroke="#D6E0EE"/>

  <!-- H0 -->
  <rect x="30" y="216" width="500" height="86" rx="10" fill="#FDE7DE" stroke="#F0A98C"/>
  <text x="46" y="242" fill="#C2410C" font-size="15" font-weight="700">H₀ (null)</text>
  <foreignObject x="46" y="250" width="468" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI,Arial,sans-serif;font-size:14px;color:#1B2A4A;line-height:1.3;">
      Overcommit scheduling does not improve packing without breaching SLAs versus a no-overcommit baseline.
    </div>
  </foreignObject>

  <!-- H1 -->
  <rect x="30" y="316" width="500" height="100" rx="10" fill="#EAF6F4" stroke="#A7E0D6"/>
  <text x="46" y="342" fill="#0E9384" font-size="15" font-weight="700">H₁ (alternative)</text>
  <foreignObject x="46" y="350" width="468" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI,Arial,sans-serif;font-size:14px;color:#1B2A4A;line-height:1.3;">
      A chance-constrained optimization layer increases effective utilization while bounding SLA violations to ε, and a decomposition heuristic preserves this at large scale.
    </div>
  </foreignObject>
</svg>
